# Темы генерации для навыка «Беседа» (TalkConnector, lib/core/skills/talk/).
# Формат файла — tools/corpus_gen/README.md, раздел «Темы и коннекторы».
#
# Беседа понимает только короткие реплики ЦЕЛИКОМ и уступает любой другой команде
# (ConnectorMatch.fallback): «привет» — беседа, «привет, добавь задачу купить хлеб» — задача.

connector = "talk"
title = "Беседа"
description = "короткие реплики: приветствия, прощания, спасибо, как дела, кто ты, что умеешь, шутки, отклики, грубость, просьбы о стиле общения, просьба открыть «Мой Связной»"
# Ровно commandId из ConnectorMatch беседы (TalkConnector.commands) и unknown.
intents = [
  "talk.greet",
  "talk.bye",
  "talk.thanks",
  "talk.howAreYou",
  "talk.whoAreYou",
  "talk.capabilities",
  "talk.joke",
  "talk.reaction",
  "talk.rude",
  "talk.setting",
  "talk.openHub",
  "talk.question",
  "unknown",
]

generation_rules = """Пиши как человек в чате, коротко, одной репликой: «привет», «добрый вечер»,
«пока», «до завтра», «спасибо», «спс», «как дела?», «как ты», «кто ты», «как тебя зовут»,
«что ты умеешь», «помощь», «расскажи шутку», «пошути», «каламбур», «ок», «понял», «круто»,
«говори короче», «давай на ты», «без смайликов», «шути меньше», «Noda, будь основной»,
«пусть отвечает Лиорио», «сделай Ноду основной». Можно с «ну», «пожалуйста», именем помощника
(Liorio, Лиорио, Lio, Лио, Noda, Нода, Нодочка, Нодь; «Лиорио» не склоняется).
Вперемешку — команды, которые начинаются теми же словами, но НЕ беседа целиком."""

label_rules = """- talk.greet — приветствие целиком: «привет», «здравствуйте», «добрый день/вечер»,
  «доброе утро», «хай», «йо», «👋».
- talk.bye — прощание целиком: «пока», «до завтра», «до свидания», «спокойной ночи»;
  несколько прощаний подряд — тоже: «пока, до завтра».
- talk.thanks — благодарность целиком: «спасибо», «спс», «благодарю», «спасибо большое»,
  «спс за инфу», «благодарю за ответ», «спс, выручил», «ок, понял, спасибо».
- talk.howAreYou — «как дела», «как ты», «как жизнь», «всё в порядке?».
- talk.whoAreYou — «кто ты», «как тебя зовут», «ты кто такой/такая», «представься»,
  «что за бот», «кто ты вообще, что за бот?».
- talk.capabilities — «что ты умеешь», «чё умеешь делать», «что можешь», «помощь», «help»,
  «помощь по командам»; вопрос о возможностях с темой — тоже, даже если такого навыка нет
  (помощник ответит, что умеет): «что ты умеешь в плане анализа данных?», «что умеешь,
  кроме шуток?». «Помощь по дому», «что ты можешь сказать про отчёт» — unknown.
- talk.joke — «расскажи шутку», «пошути», «шути!», «анекдот», «каламбур», «ещё шутку»,
  «давай следующую шутку», «шутку, тема: политика», «пошути, что ты умный»; с целью после
  «для» — тоже: «расскажи шутку для выступления на мите»; «спс за шутку, ну ещё!». Отказ от
  одного рода и просьба о другом — joke: «каламбуры не люблю, дай анекдот». «Я пошутил» —
  unknown, «быстро пошутил!» — joke.
- talk.reaction — короткий отклик: «ок», «понял», «ясно», «круто», «👍», «всё ок»,
  похвала: «жги ещё», «не останавливайся».
- talk.rude — грубость в адрес помощника: «ты тупой», «дурак», «отстань», «ну ты и
  тормоз», «я тебя не люблю».
- talk.setting — просьба о стиле общения: «говори короче/подробнее/официально»,
  «давай дружелюбнее», «давай на ты/на вы», «без смайликов», «можно со смайликами»,
  «шути меньше/больше», «не шути», «Noda, будь основной», «пусть отвечает Лио»,
  «сделай Ноду основной» («главной» — то же, «в чате» ничего не меняет), «говори как с
  другом», «будь вежливее», «без пафоса», «официально не надо» (стиль наоборот), «давай с
  юмором», «хватит паясничать».
- talk.openHub — открыть раздел «Мой Связной» (он зовётся так при любом имени и роде
  главного помощника): «мой Связной», «открой мой Связной», «перейди в мой Связной», «покажи
  мой Связной», «открой раздел «Мой Связной»»; прежнее «мой Tridot» — тоже. «Мой Связной не
  отвечает» — unknown.
- talk.question — справочный вопрос о мире, на который помощник без сети не ответит:
  «напомни, какая формула суммы в гугл-таблицах?», «подскажи, как называется столица
  Австралии», «где лежат ключи от гаража?», «что такое ипотека»; и просьба вспомнить за
  пользователя: «напомни, что я хотел купить». «Напомни купить хлеб», «напомни спросить, какая
  формула» — задачи (unknown для беседы). Вопросы о самом помощнике и о делах в приложении
  («как дела у проекта», «кто ты такой», «как поменять пароль») — не talk.question.
- Замечание после запятой не меняет тему просьбы о шутке, стиле или «что умеешь»: «говори
  короче, задолбал», «будь дружелюбнее, а то ты сухой», «пусть Нода отвечает, а ты подожди»,
  «давай ещё одну, не смешно» — тема просьбы. Если после запятой команда («говори короче,
  добавь задачу …») — unknown.
- Вступление (приветствие, «спасибо») и за ним другая реплика беседы — тема этой реплики:
  «привет, говори короче» — talk.setting, «спасибо, пока» — talk.bye, «привет, ты тупой» —
  talk.rude. Имя помощника в любом месте реплики («спасибо, Нода», «Лио, привет») тему не
  меняет; имя с одной опечаткой в обращении в начале реплики («Лео», «Лииорио», «Нод») — тоже
  имя; дальше в реплике — нет («пусть отвечает Лион» — unknown).
- unknown — всё остальное, в том числе реплика внутри команды: «привет, добавь задачу купить
  хлеб», «пока не забыл, купить хлеб», «спасибо, перенеси отчёт на завтра», «как дела у
  проекта Ремонт», «расскажи про задачи», «добавь задачу рассказать шутку»,
  «расскажи шутку на корпоративе» (дело, а не просьба к помощнику), числа и сроки
  («ок 15:00», «до завтра сдать отчёт»), длинные рассуждения."""

[topics.social]
description = """приветствия, прощания, благодарности, «как дела», «кто ты», «что умеешь», \
короткие отклики и грубость — реплики целиком, с именем помощника и без"""
intents = [
  "talk.greet",
  "talk.bye",
