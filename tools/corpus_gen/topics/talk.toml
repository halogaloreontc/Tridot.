[topics.jokes]
description = """просьбы рассказать шутку, анекдот или каламбур, ещё одну шутку"""
intents = ["talk.joke"]

[topics.style]
description = """просьбы о стиле общения: короче, подробнее, дружелюбнее, официально, \
на ты и на вы, без смайликов и со смайликами, шутить меньше и больше, кто основной"""
intents = ["talk.setting"]

[topics.tricky]
description = """команды и фразы, которые начинаются словами беседы, но беседой не являются: \
«привет, добавь задачу …», «пока не забыл, …», «спасибо, перенеси …», «до завтра сдать …», \
«расскажи шутку на корпоративе — задача», вопросы о делах проекта; и вперемешку с ними — \
настоящие реплики беседы"""
