# Темы генерации для встроенного коннектора задач (TasksConnector).
# Формат файла и как добавить коннектор — tools/corpus_gen/README.md, раздел «Темы и коннекторы».
#
# Правила генерации и разметки задач встроены в corpus_gen/prompts.py
# (TASKS_GENERATION_RULES и LABEL_SYSTEM), поэтому generation_rules и label_rules здесь не нужны.

connector = "tasks"
title = "Задачи"
description = "создание, перенос, завершение и просмотр задач"
intents = ["createTask", "listTasks", "completeTask", "rescheduleTask", "unknown"]
# Намерения, у которых в корпусе есть title (для остальных title всегда null).
title_intents = ["createTask", "rescheduleTask", "completeTask"]
# Намерения, у которых в корпусе есть срок due (для остальных due всегда null).
due_intents = ["createTask", "rescheduleTask"]

[topics.create]
description = """создание задачи обычной фразой в чате, чаще всего БЕЗ кавычек («добавь позвонить \
маме завтра в 10», «напомни в пятницу купить хлеб», «запиши сдать отчёт #работа»), иногда с \
названием в кавычках; разные сроки: сегодня, завтра, послезавтра, дни недели («в пятницу», «во \
вторник в 10», «в пт к 18:00», «в следующую среду», «до субботы»), «через N минут/часов/дней/недель» \
(«через час», «через полчаса», «через 3 дня», «через пару дней»), «на выходных», «на следующей \
неделе», «в конце недели», ДД.ММ, ДД.ММ.ГГГГ, время ЧЧ:ММ и «в ЧЧ.ММ», «в 9», части суток \
(«утром», «днём», «после обеда», «вечером», «завтра вечером», «в пятницу утром», «вечером в 8»), \
без срока; хештеги, «пожалуйста», «мне» после «напомни»; название существительным в разных \
падежах («добавь встречу с клиентом», «напомни про встречу», «напомни о звонке маме», «напомни \
об оплате счёта», «напомни насчёт отчёта», «добавь новую презентацию»); «поставь»/«заведи» с \
инфинитивом или кавычками без слова «задачу» («поставь подготовить презентацию к понедельнику»); \
иногда без слова-команды, начиная с действия («через 3 дня сдать отчёт», «надо купить хлеб», «не \
забыть оплатить интернет завтра», «мне нужно "помыть машину" после обеда») — это тоже создание"""
intents = ["createTask"]

[topics.reschedule]
description = """перенос задачи: «её», «эту задачу», выбранной или названной словами без кавычек \
(«перенеси звонок клиенту на пятницу») либо в кавычках; на день, день недели («на пт», «на \
следующую среду»), «через 2 дня», «на выходные», дату, время; формы «перенеси», «перенести», \
«сдвинь», «отложи», «с … на …» («с пятницы на понедельник»)"""
intents = ["rescheduleTask"]

[topics.complete]
description = """завершение задачи: повелительные и прошедшие формы, «готово», «сделано», задача \
названа словами без кавычек («заверши отчёт для Ивана», «отметь звонок маме выполненным») или в \
кавычках, а также похожие фразы, которые НЕ являются командой: вопросы и отрицания \
(«не выполнил отчёт», «я не сделал?»); сообщения о сделанном глаголом прошедшего времени без \
слова-команды («я купил хлеб», «отчёт сдал», «позвонила маме») — тоже завершение"""
intents = ["completeTask"]

[topics.implicit]
description = """команды без слова-команды: фраза начинается с действия в инфинитиве после срока \
или вступления («через полчаса позвонить маме», «на выходных съездить на дачу», «мне нужно отнести \
посылку», «хочу испечь пирог в субботу») — создание; сообщение о сделанном в прошедшем времени \
(«я купил хлеб», «купила молоко», «отчёт сдал», «я уже оплатил интернет») — завершение; час сразу \
после дня («добавь завтра в 10 созвон с командой»); и похожие фразы, которые НЕ команды: вопросы \
(«купить хлеб?»), приветствия, «не купить хлеб», «купить хлеб не надо», «кстати», просьбы \
к помощнику («показать список», «отметить хлеб»), фразы с существительного («тетрадь купить», \
«новость обсудить», «ногти постричь»), рассказ о других («мама купила хлеб»)"""
intents = ["createTask", "completeTask", "unknown"]

[topics.list]
description = "просьбы показать список задач или планы, и похожие фразы не про задачи"
intents = ["listTasks"]

[topics.unknown]
description = "фразы, не относящиеся к задачам: приветствия, вопросы о погоде, болтовня"
intents = ["unknown"]

[topics.tricky]
description = """трудные случаи: названия без кавычек, похожие на сроки («купить завтрак», \
«пятничный отчёт», «настроить среду разработки», «перейти через дорогу», «обновить до версии \
2.10», «встреча в 5 корпусе»), сегодняшний день недели со временем и без, «в эту пятницу», когда \
она прошла, день недели вместе с другой датой («в пятницу 10.11»), «не» внутри названия («заверши не забыть \
купить хлеб»), слова-команды и даты внутри названия в кавычках, вложенные и незакрытые кавычки, \
несколько названий, противоречивые сроки, несуществующие даты и время, номера телефонов и \
артикулов, опечатки, лишние пробелы, ЗАГЛАВНЫЕ буквы; слова, похожие на часть суток («поздравить \
с днём рождения», «днём раньше», «после обеда с клиентом»), винительный падеж при глаголе \
(«добавь машину помыть», «добавь Машу забрать из школы»), дательный («добавь клиенту счёт»), \
«поставь чайник», «поставь будильник на 7», «запиши меня к врачу»"""
# intents не указаны: примеры берутся из всего корпуса коннектора.

[topics.gaps]
description = """естественные формулировки сроков, которые помощник может ещё не понимать: \
«ночью», «в обед», «к вечеру», «после работы», месяц словом («15 ноября»), «через полтора часа», \
«через 2-3 дня», «по пятницам», «в начале месяца», «на этой неделе»; названия, именительный \
падеж которых неочевиден («напомни о Москве», «напомни про клиента», «о новом проекте»)"""
