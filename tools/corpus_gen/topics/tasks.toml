# Темы генерации для встроенного коннектора задач (TasksConnector).
# Формат файла и как добавить коннектор — tools/corpus_gen/README.md, раздел «Темы и коннекторы».
#
# Правила генерации и разметки задач встроены в corpus_gen/prompts.py
# (TASKS_GENERATION_RULES и LABEL_SYSTEM), поэтому generation_rules и label_rules здесь не нужны.

connector = "tasks"
title = "Задачи"
description = "создание, перенос, завершение и просмотр задач"
intents = ["createTask", "listTasks", "completeTask", "rescheduleTask", "unknown"]
# Намерения, у которых в корпусе есть title (для остальных title всегда null).
title_intents = ["createTask", "rescheduleTask", "completeTask"]
# Намерения, у которых в корпусе есть срок due (для остальных due всегда null).
due_intents = ["createTask", "rescheduleTask"]

[topics.create]
description = """создание задачи обычной фразой в чате, чаще всего БЕЗ кавычек («добавь позвонить \
маме завтра в 10», «напомни в пятницу купить хлеб», «запиши сдать отчёт #работа»), иногда с \
названием в кавычках; разные сроки: сегодня, завтра, послезавтра, ДД.ММ, ДД.ММ.ГГГГ, время ЧЧ:ММ и \
«в ЧЧ.ММ», «в 9», без срока; хештеги, «пожалуйста», «мне» после «напомни»"""
intents = ["createTask"]

[topics.reschedule]
description = """перенос задачи: «её», «эту задачу», выбранной или названной словами без кавычек \
(«перенеси звонок клиенту на пятницу») либо в кавычках; на день, дату, время; формы «перенеси», \
«перенести», «сдвинь», «отложи», «с … на …»"""
intents = ["rescheduleTask"]

[topics.complete]
description = """завершение задачи: повелительные и прошедшие формы, «готово», «сделано», задача \
названа словами без кавычек («заверши отчёт для Ивана», «отметь звонок маме выполненным») или в \
кавычках, а также похожие фразы, которые НЕ являются командой: вопросы и отрицания \
(«не выполнил отчёт», «я не сделал?»)"""
intents = ["completeTask"]

[topics.list]
description = "просьбы показать список задач или планы, и похожие фразы не про задачи"
intents = ["listTasks"]

[topics.unknown]
description = "фразы, не относящиеся к задачам: приветствия, вопросы о погоде, болтовня"
intents = ["unknown"]

[topics.tricky]
description = """трудные случаи: названия без кавычек, похожие на сроки («купить завтрак», \
«обновить до версии 2.10», «встреча в 5 корпусе»), «не» внутри названия («заверши не забыть \
купить хлеб»), слова-команды и даты внутри названия в кавычках, вложенные и незакрытые кавычки, \
несколько названий, противоречивые сроки, несуществующие даты и время, номера телефонов и \
артикулов, опечатки, лишние пробелы, ЗАГЛАВНЫЕ буквы"""
# intents не указаны: примеры берутся из всего корпуса коннектора.

[topics.gaps]
description = """естественные формулировки сроков, которые помощник может ещё не понимать: дни \
недели, «через час», «через 3 дня», «в 9 утра», «вечером», месяц словом («15 ноября»), «на \
следующей неделе», «к концу недели»"""
