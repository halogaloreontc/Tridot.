# Темы генерации для склада halowarekeep: ManifestConnector по описанию assistant/1
# (lib/core/connectors/manifest/, test/fixtures/assistant/halowarekeep.json, ADR-011).
# Формат файла — tools/corpus_gen/README.md, раздел «Темы и коннекторы».
#
# Намерения — ровно commandId коннектора: warehouse.<id команды описания>. Новая команда
# в assistant.json склада — новое намерение здесь и строки в test/corpus/warehouse.jsonl.

connector = "warehouse"
title = "Склад"
description = "склад halowarekeep: где лежит товар, остатки, что в ячейке, приходы за день и неделю, приходы без фото; только чтение"
intents = [
  "warehouse.where",
  "warehouse.count",
  "warehouse.price",
  "warehouse.cell",
  "warehouse.today",
  "warehouse.yesterday",
  "warehouse.week",
  "warehouse.nophoto",
  "warehouse.help",
  "unknown",
]

generation_rules = """Артикул — число из 5–6 цифр (64115, 120734), его никогда не читают как дату или
время. Ячейка — код вида 215-1-1-1, стеллаж — 215-3, склад — 215а, «без места». Пиши как
кладовщик в чате: коротко, иногда «на складе …» или «склад, …» в начале. Названия товаров
словами: «стул венский», «венских стульев». Склад понимает фразы по образцам: вопрос
целиком о складе, от начала до конца сообщения."""

label_rules = """- warehouse.where — где лежит товар: «где лежит 64115», «где стул венский», «найди 64115»,
  «64115 где», «поиск стул венский»; голый артикул «64115»; с обращением «на складе стул венский».
- warehouse.count — сколько осталось: «сколько венских стульев», «остаток 64115», «сколько у нас стульев».
- warehouse.price — цена: «сколько стоит 64115», «цена стул венский» (склад честно не называет).
- warehouse.cell — что в ячейке: «что в ячейке 215-1-1-1», «стеллаж 215-3», голый код «215-1-1-1», «без места».
- warehouse.today / warehouse.yesterday / warehouse.week — приходы: «что пришло сегодня»,
  «приходы за вчера», «что пришло за неделю», «за 7 дней».
- warehouse.nophoto — приходы без фото: «какие приходы без фото», «где нет фото».
- warehouse.help — что умеет склад: «что умеет склад», «помощь по складу», «склад, помощь».
- unknown — всё остальное: одно слово без поля («сегодня», «вчера», «помощь», «команды»),
  приветствие и беседа («привет», «что ты умеешь», «сколько тебе лет», «сколько времени»),
  примеры калькулятору («сколько будет 2+2», «215 - 3»), задачи («сколько у меня задач»,
  «найди задачу отчёт», «добавь задачу проверить, где лежит 64115», «через 2 часа позвонить»),
  поле со сроком или датой («найди время завтра», «где лежит 15.11»)."""

[topics.stock]
description = "где лежит товар и сколько осталось: по артикулу и по названию, разный порядок слов, связки «покажи», «подскажи»"
intents = ["warehouse.where", "warehouse.count", "warehouse.price"]

[topics.cell]
description = "что лежит в ячейке, на стеллаже, на складе; голые коды ячеек"
intents = ["warehouse.cell"]

[topics.arrivals]
description = "приходы за сегодня, вчера, неделю; приходы без фото"
intents = ["warehouse.today", "warehouse.yesterday", "warehouse.week", "warehouse.nophoto"]

[topics.tricky]
description = """фразы, которые склад брать НЕ должен: однословные «сегодня», «помощь», приветствия, \
примеры калькулятору, задачи со словами склада, сроки и даты — и вперемешку с ними настоящие вопросы складу"""
