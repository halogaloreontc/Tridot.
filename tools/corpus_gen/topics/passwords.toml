generation_rules = """СТРОГО, это правило нарушать нельзя даже ради теста: во фразе НЕТ самого пароля, PIN-кода,
кода домофона или подъезда, кода из СМС, логина, имени пользователя, адреса почты, номера телефона
и ничего похожего на секрет. Не пиши «пароль: …», «пин = …», «логин … пароль …», «пароль от wifi
это …», не бери ничего в кавычки, не пиши слова с цифрами или символами (wifi2024, Qwerty!),
длинные числа и коды. Сервис называй словами без кавычек: почта, госуслуги, сбер, озон, вк,
wifi, роутер, банк, рабочий ноутбук. Числа — только параметры генератора («на 20 символов»,
«из 5 слов»). Пиши как человек в чате: коротко, разговорно, иногда с опечатками, «пожалуйста»,
обращением «Лиорио,» в начале или без глагола («пароль от почты?»)."""

label_rules = """- passwords.hint — забыл пароль от сервиса, подсказка: «забыл пароль от почты», «не помню пароль от
  госуслуг», «какой у меня пароль от сбера», «подсказка к паролю от wifi», «пароль от почты?»,
  «напомни (мне) пароль от почты», «подскажи пароль от почты», «где пароль от почты», «найди пароль
  от почты», «нужен пароль от wifi», «забыл логин и пароль от почты», «где мой пароль».
- passwords.reveal — явная просьба показать: «покажи пароль от почты», «дай пароль от wifi»,
  «скажи мне пароль от озона», «скинь пароль от wifi», «покажи пароль»; «дай пароль от wifi гостям» —
  тоже reveal (человек сам покажет гостям).
- passwords.copy — скопировать: «скопируй пароль от почты», «скопируй мой пароль от вк».
- passwords.login — логин: «какой у меня логин от госуслуг», «забыл логин от почты», «напомни логин
  от почты», «на какую почту я регистрировался в озоне».
- passwords.add — запомнить новый: «запомни пароль от озона», «добавь пароль для озона», «сохрани
  новый пароль».
- passwords.change — сменить в хранилище: «смени пароль от почты», «поменяй пароль от госуслуг».
- passwords.delete — удалить запись: «удали пароль от старого форума», «удали запись форум из паролей».
- passwords.list — какие сохранены: «какие пароли сохранены», «сколько паролей в хранилище», «покажи
  все пароли», «где мои пароли».
- passwords.open / passwords.lock — открыть или запереть хранилище: «открой пароли», «открой
  хранилище»; «запри пароли», «закрой хранилище».
- passwords.generate — генератор: «сгенерируй пароль», «придумай надёжный пароль», «пароль из слов»,
  «пароль на 24 символа без символов», «нужен новый случайный пароль», «нужен пароль на 20 символов».
- passwords.check — проверка надёжности: «проверь мои пароли», «есть ли слабые пароли», «где
  одинаковые пароли», «проверь надежность паролей».
- passwords.train — тренировка памяти: «потренируй меня», «потренируй меня в паролях», «проверь,
  помню ли я пароль от почты».
- passwords.backup / passwords.import / passwords.restore — резервная копия, импорт, восстановление
  из копии: «сделай резервную копию паролей», «импортируй пароли из браузера», «перенеси пароли из
  firefox», «восстанови пароли из копии», «верни пароли из бэкапа».
- passwords.masterForgot — забыт мастер-пароль: «забыл мастер-пароль», «не помню пароль от
  хранилища», «не могу открыть пароли».
- passwords.lostDevice — потерян или сменён телефон: «потерял телефон», «украли ноутбук», «переезжаю
  на новый ноутбук», «как перенести пароли на новый телефон».
- passwords.recoverHelp — как восстановить доступ без сервиса: «забыл пароль», «не могу войти, забыл
  пароль», «как восстановить пароль от сайта».
- passwords.help — что умеет навык и советы: «что умеешь с паролями», «как придумать хороший
  пароль», «расскажи, как поменять пароль», одно слово «пароль».
- unknown — всё остальное, в том числе:
  задачи (маркеры «напомни» + действие, «в задачи», «добавь задачу», срок, #метка): «напомни сменить
  пароль», «напомни завтра сменить пароль от почты», «добавь задачу проверить пароли на работе»,
  «записать пароль от wifi в задачи»; инфинитив чужого глагола и чужой глагол перед паролем — дело,
  а не навык (инфинитив команды навыка — команда: «добавить пароль от банка», «сменить пароль для
  почты»):
  «поставить пароль на wifi», «поставь пароль на роутер», «купи роутер и поставь пароль на wifi»,
  «спросить у админа пароль от wifi», «узнать пароль от wifi»;
  просьбы о другом человеке и для другого: «скажи Пете пароль от wifi», «отправь Пете пароль от
  wifi», «Маша просила пароль от wifi», «мама просит придумать пароль», «папа спрашивает пароль от
  почты»;
  копия, бэкап и восстановление без слов «пароль», «хранилище» — в приложении есть и общая
  резервная копия данных: «сделай бэкап», «восстановление из бэкапа», «как сделать копию чтобы не
  пропало»; импорт без слова «пароли» — только из браузера или файла txt/csv (его загружает только
  импорт паролей): «перенеси всё из сафари», «хочу загрузить список из txt» — passwords.import, а
  «перенеси с хрома закладки», «перенеси данные из csv в таблицу» — unknown;
  калькулятор и склад: «сколько будет 6 паролей на 2», «где лежит отчёт», «не могу войти на склад»,
  «как восстановить доступ к складу»;
  не о паролях: «потерял ключи от машины», «покажи телефон», «купить чехол, потерял телефон»,
  «разбил телефон, нужно купить новый», «не могу зайти к маме сегодня», «потренируй меня в
  английском», «открой задачи», «пароль — это важно»;
  разговор о паролях вообще и почта людей: «написать статью про одинаковые пароли», «почему простые
  пароли опасны», «какая почта у Ивана», «на какой адрес была доставка», «мастер-класс по
  тренировке памяти», «сделай для поста на 280 символов текст», «сейф не открывается»."""

