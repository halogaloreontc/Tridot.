#
# Намерения — ровно commandId навыка: PasswordCommands.all в порядке объявления и «unknown».
# Новая команда навыка — новое намерение здесь (это сверяют tests/test_passwords.py и
# test/tool/route_phrases_test.dart) и строки в test/corpus/passwords.jsonl.
#
# В модели уходят только синтетические фразы о паролях: без самих паролей, PIN-кодов, кодов,
# логинов, адресов почты и телефонов. Фразы, похожие на секрет, corpus_gen отбрасывает до
# сохранения (corpus_gen/secret_filter.py) и показывает только их число.

