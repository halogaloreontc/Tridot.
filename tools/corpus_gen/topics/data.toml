# Темы генерации для навыка «Данные» (DataConnector, lib/core/skills/data/data_connector.dart,
# разбор — DataPhrases в data_phrases.dart). Формат файла — tools/corpus_gen/README.md,
# «Темы и коннекторы».
#
# В приложении два набора данных с копиями: сейф с паролями (навык «Пароли») и все остальные
# данные (задачи и сессии, Настройки → «Данные и резервная копия»). На двусмысленную фразу без
# опоры («сделай бэкап», «открой хранилище») навык задаёт уточняющий вопрос: data.clarify.
# Контекст сессии (поле корпуса `after`) модели не размечают: такие строки пишет человек
# (test/corpus/data.jsonl). Фразы этого коннектора не строгие для secret_filter.py: о паролях
# здесь не говорят, а со словом «пароль» фраза — навыка «Пароли».

connector = "data"
title = "Данные"
description = "резервная копия и восстановление без слова о паролях, голое «хранилище», копия и восстановление всех данных приложения"
# Ровно commandId из ConnectorMatch навыка (кроме data.context — он разбирается заново).
intents = ["data.clarify", "data.backup", "data.restore", "data.open", "data.lock", "unknown"]

generation_rules = """Пиши как человек в чате: коротко, разговорно, иногда с «пожалуйста» и обращением
«Лиорио,» в начале. Без слов «пароль», «сейф», «мастер-пароль»: это фразы о данных вообще.
Без паролей, кодов, логинов, адресов почты и телефонов."""

label_rules = """- data.clarify — копия или восстановление без объекта и любое действие с голым «хранилище»:
  непонятно, сейф с паролями или все данные, помощник переспросит: «сделай бэкап», «сделай
  резервную копию», «нужна копия», «сохрани копию», «бэкап сделай», «как сделать копию, чтобы не
  пропало», «восстанови из копии», «восстановление из бэкапа», «верни всё из вчерашнего бэкапа»,
  «открой хранилище», «закрой хранилище», «сделай копию хранилища», «хранилище не открывается».
- data.backup — копия всех данных приложения: «сделай резервную копию всех данных», «задачи и
  чаты сохрани в копию».
- data.restore — восстановить все данные: «восстанови все данные из копии».
- data.open — где данные, сколько места: «открой данные приложения».
- data.lock — запереть данные: «запри данные приложения» (ответ: данные не запираются).
- unknown — всё остальное: со словом «пароль», «сейф», «хранилище паролей» — навык «Пароли»
  («сделай бэкап паролей», «открой хранилище паролей»); копия чего-то названного («сделай копию
  договора», «восстанови задачу из копии»); хранилище вещей («купить хранилище для велосипеда»,
  «облачное хранилище подорожало», «копия ключа от хранилища»); дело с инфинитивом или «нужно»
  («нужно сделать бэкап», «сделать бэкап» — задача); «закрой задачу хранилище» — задача;
  «сколько записей в хранилище» — склад."""

[topics.vague]
description = "копия, бэкап и восстановление без объекта и без слова о паролях; голое «хранилище» с действием: открыть, закрыть, запереть, копия, восстановить, не открывается, нет доступа"
intents = ["data.clarify"]

[topics.everything]
description = "копия, восстановление, открыть и запереть все данные приложения: «всех данных», «данные приложения», «задачи и чаты»"
intents = ["data.backup", "data.restore", "data.open", "data.lock"]

[topics.tricky]
description = """фразы, похожие на просьбу о данных, но не они: копия чего-то названного (договор, ключи, \
документы), хранилище вещей и облачные сервисы, задачи с инфинитивом («нужно сделать бэкап»), \
фразы со словом «пароль» или «сейф»; и вперемешку с ними — настоящие двусмысленные просьбы"""
