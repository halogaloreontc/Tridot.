# Темы генерации для навыка «Калькулятор» (CalculatorConnector, lib/core/skills/calculator/).
# Формат файла — tools/corpus_gen/README.md, раздел «Темы и коннекторы».
#
# Корпус калькулятора (test/corpus/calc.jsonl) может хранить и ожидаемый ответ — ключ
# "answer" («6», «≈ 3,333333333», «На ноль делить нельзя.»). Модели его не размечают:
# ответ дописывает человек при переносе, scenario_corpus_test.dart сверяет его с калькулятором.

connector = "calc"
title = "Калькулятор"
description = "арифметические примеры: действия, скобки, проценты, степени, корни, числа словами"
# Ровно commandId из ConnectorMatch калькулятора.
intents = ["calc.evaluate", "unknown"]

generation_rules = """Пиши как человек в чате: «сколько будет 2+2*2», «15% от 2400», «корень из 144»,
«3,5 умножить на 12», «посчитай (10 + 5) / 3», «2+2=», «чему равно 7*8», «два плюс два».
Десятичная запятая и точка, знаки + - * / × ÷ : ^ %, скобки, «в квадрате», «в кубе»,
«в степени», «умножить на», «разделить на». Числа словами — небольшие (ноль…тысяча)."""

label_rules = """- calc.evaluate — сообщение просит посчитать пример: с маркером («сколько будет», «посчитай»,
  «вычисли», «реши», «… равно?», «=» в конце) или само сообщение целиком — пример
  («2+2*2», «15% от 2400», «корень из 144»). Неполный пример с маркером («сколько будет 2 +») —
  тоже calc.evaluate: помощник переспросит.
- unknown — всё остальное: даты («12.11»), время («18:30», «в 10»), одиночные числа и артикулы
  («64115»), диапазоны («10-15 минут», «2-3 дня»), телефоны («+7 999 123-45-67»,
  «8-800-555-35-35»), версии («2.10»), метки («#2»), задачи с числами («купить 2 кг муки»,
  «добавь задачу 2+2», «через 2 часа позвонить»), вопросы складу («где лежит 64115»).
  Без маркера unknown и целые числа, сцепленные вплотную «-» или «/» без других знаков:
  «64115-01», «64115/2», «555-1234», «10-15», «12/11», «05/11/2026», «24/7». С пробелами
  («10 - 15»), с другими знаками («2+10/5») или с маркером («посчитай 24/7») — calc.evaluate.
- Ответ (answer) не размечается: его проверяет тест корпуса."""

[topics.evaluate]
description = """примеры с маркером и без: порядок действий, скобки, десятичные дроби, деление \
с остатком и бесконечные дроби, проценты («15% от 2400», «2400 плюс 15%»), степени и корни, \
числа словами, деление на ноль"""
intents = ["calc.evaluate"]

[topics.tricky]
description = """фразы с числами, которые НЕ примеры: даты, время, телефоны, диапазоны, \
версии, артикулы, задачи с количеством, сроки «через 2 часа»; и вперемешку с ними — \
настоящие примеры"""
