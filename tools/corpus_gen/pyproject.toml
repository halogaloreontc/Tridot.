[project]
name = "corpus-gen"
version = "0.1.0"
description = "Генерация и перекрёстная разметка фраз для регрессионного корпуса ScenarioParser (только для разработки)."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.4,<3",
  "openai>=3.45,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
corpus-gen = "corpus_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
