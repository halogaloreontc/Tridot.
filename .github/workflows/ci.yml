name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

# Версии закреплены (ADR-036): с плавающим `channel: stable` CI 2026-11-11
# сам перешёл на Flutter 3.50 и упал на `flutter analyze` (устаревший
# package:flutter/material.dart), хотя код не менялся. Новую версию берём
# отдельной правкой: здесь, в web-assistant-release.yml и в README.
env:
  FLUTTER_VERSION: 3.47.9

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Веб-помощник склада (ADR-032): собирается из того же кода.
      - run: flutter build web --release -t lib/web_widget/main.dart --no-web-resources-cdn --no-source-maps

  android:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
