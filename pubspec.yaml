name: local_assistant
description: Tridot (Relay) — локальное приложение на правилах, в котором работают помощники Садо, Лиорио и Нода; технический прототип.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Длина названия сессии — в видимых знаках, как у TextField.maxLength
  # (уже есть транзитивно у flutter).
  characters: ^1.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  # Хранилище паролей (ADR-014): libsodium — Argon2id, XChaCha20-Poly1305,
  # crypto_kdf, BLAKE2b с ключом, SecureKey вне кучи Dart. Версии закреплены:
  # последние стабильные не моложе двух недель на момент внедрения.
  sodium: 4.1.2
  file_selector: ^1.1.0
  # Голосовой ввод (ADR-023). crypto, archive и ffi уже были транзитивно —
  # теперь прямые, версии закреплены: SHA-256 модели, безопасная распаковка
  # zip, привязка dart:ffi к libvosk.so. record — поток PCM с микрофона
  # (BSD-3); runtime-запрос RECORD_AUDIO делает он сам.
  crypto: 3.0.8
  archive: 4.6.0
  ffi: 2.2.0
  record: 7.2.0
  # Конвертер картинок (ADR-024, шаг 2): png/jpeg/webp/bmp/gif → png/jpeg
  # на чистом Dart, в отдельном изоляте. MIT; версия закреплена.
  image: 4.12.0
  # Встроенный кодировщик MP3 (ADR-026): LAME 3.100 (LGPL-2.0-or-later)
  # отдельной разделяемой библиотекой libtridot_mp3 — её собирает
  # build-хук пакета для Android, macOS и Linux (тесты).
  tridot_lame:
    path: packages/tridot_lame
  # Сканер QR склада (ADR-031): камера и распознавание на устройстве —
  # Android CameraX и встроенная в APK модель ML Kit (не скачивается из
  # Google Play Services: свойство useUnbundled не включено), macOS
  # AVFoundation и Vision. BSD-3; версия закреплена (7.4.2, 2026-09-14).
  mobile_scanner: 7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Таймеры хранилища паролей в тестах (уже есть транзитивно у flutter_test).
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/GolosText-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/fonts/CormorantUnicase-OFL.txt
    # Встроенные паки (docs/EXTENSIONS.md): только данные, без кода.
    - assets/packs/
    # Каталоги ответов по стилям (docs/REPLIES.md). Ядро читает их копию
    # lib/core/replies/builtin_replies.g.dart (tool/gen_replies.dart).
    - assets/replies/
    # Встроенные копии описаний assistant/1 подключений (ADR-011): по ним
    # коннектор понимает фразы до подключения.
    - assets/connectors/
    # Словари навыка «Пароли» (ADR-014): EFF large (CC BY 3.0 US) для
    # генератора и 10 000 частых паролей SecLists (MIT) для оценки
    # надёжности. Лицензии — assets/passwords/NOTICE.txt.
    - assets/passwords/
    # Голосовой ввод (ADR-023): лицензии Vosk, Kaldi, OpenFST, OpenBLAS и
    # модели vosk-model-small-ru (модель скачивается, а не встроена).
    - assets/voice/NOTICE.txt
    # Конвертер (ADR-024): лицензии скачиваемого ffmpeg (LGPL, libmp3lame).
    - assets/extensions/NOTICE.txt
  fonts:
    # Весь текст интерфейса (ADR-021): переменный, ось wght 400–900.
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMonoVariable.ttf
    # Название «Tridot» и проектов (ADR-021): только начертание SemiBold.
    - family: Cormorant Unicase
      fonts:
        - asset: assets/fonts/CormorantUnicase-SemiBold.ttf
          weight: 600
