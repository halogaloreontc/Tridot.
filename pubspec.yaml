name: local_assistant
description: Локальный персональный помощник на правилах — технический прототип.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
